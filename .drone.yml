---

kind: pipeline
name: Docker build dev

trigger:
  branch:
    - dev

steps:
  - name: docker
    image: plugins/docker
    settings:
      repo:
        from_secret: repo
      tag: "dev"
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

---

kind: pipeline
name: Docker build latest

trigger:
  branch:
    - master

steps:
  - name: docker
    image: plugins/docker
    settings:
      repo:
        from_secret: repo
      tag: "latest"
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

---

kind: pipeline
name: Docker build tags

trigger:
  ref:
    - refs/tags/*

steps:
  - name: docker
    image: plugins/docker
    settings:
      repo:
        from_secret: repo
      auto_tag: true
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

---

kind: pipeline
name: Docker build hlos-dash-server dev

trigger:
  branch:
    - dev

steps:
  - name: docker
    image: plugins/docker
    settings:
      repo: homelabos/hlos-dash-server
      context: roles/hlos_dash
      dockerfile: roles/hlos_dash/deploy/server.Dockerfile
      tag: "dev"
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password


---

http:
  middlewares:
    authelia:
      forwardAuth:
        address: "http://auth:9091/api/verify?rd=https://{% if authelia.domain %}{{ authelia.domain }}{% else %}{{ authelia.subdomain + "." + domain }}{% endif %}/"
        trustForwardHeader: true
{% if enable_tor %}
    authelia-tor:
      forwardAuth:
        address: "http://auth-tor:9091/api/verify?rd=http://{{ authelia.subdomain }}.{{ tor_domain }}/"
        trustForwardHeader: true
{% endif %}
    basicAuth:
      basicAuth:
        usersFile: "/basicAuth"
    redirect:
      redirectScheme:
        scheme: https
{% if domain %}
    customFrameHomelab:
      headers:
        customFrameOptionsValue: "ALLOW-FROM http://{{ domain }} ALLOW-FROM https://{{ domain }}"
{% endif %}{% if enable_tor %}
    customFrameHomelab-tor:
      headers:
        customFrameOptionsValue: "ALLOW-FROM http://{{ tor_domain }}"
{% endif %}
    security-headers:
      headers:
        stsSeconds: 31536000
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        stsPreload: true
{% if matomo.enable | default(False) %}
    matomo-tracking:
      plugin:
        matomoTracking:
          # Direct container address on the homelabos_traefik network, so
          # tracking requests bypass Traefik itself (avoids re-triggering this
          # middleware and any auth middlewares on the Matomo router).
          matomoURL: "http://matomo/matomo.php"
          domains:
{% for item in services | flatten(1) %}
{% if item != 'matomo' and (lookup('vars', item).enable | default(False)) %}
            "{% if lookup('vars', item).domain | default(False) %}{{ lookup('vars', item).domain }}{% else %}{{ lookup('vars', item).subdomain }}.{{ domain }}{% endif %}":
              trackingEnabled: true
              idSite: {{ matomo.site_id | default(1) }}
              excludedPaths:
                - "^/favicon\\.\\w+$"
                - "\\.(png|jpe?g|gif|webp|avif|svg|ico|css|js|mjs|woff2?|ttf|eot|otf|mp4|webm|mp3|ogg|pdf|zip|gz)(\\?.*)?$"
{% endif %}
{% endfor %}
{% endif %}

- name: Ensure locale en_US.UTF-8 locale is present
  locale_gen:
    name: en_US.UTF-8
    state: present
  when: ansible_os_family == "Debian"

- name: Ensure locale en_US.UTF-8 locale is enabled
  lineinfile:
    path: /etc/locale.gen
    regexp: '^#?en_US\.UTF-8 UTF-8'
    line: 'en_US.UTF-8 UTF-8'
  register: arch_locale_gen
  when: ansible_os_family == "Archlinux"

- name: Generate locale en_US.UTF-8
  command: locale-gen
  when:
    - ansible_os_family == "Archlinux"
    - arch_locale_gen.changed

- name: adding existing user '{{ homelab_ssh_user }}' to group docker
  user:
    name: "{{ homelab_ssh_user }}"
    groups: docker
    append: true
  become: true

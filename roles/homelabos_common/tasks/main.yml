---
- name: Configure host DNS before package installs
  include_role:
    name: homelabos_systemd-resolve

- name: Install necessities and nice-to-haves
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - cifs-utils
      - curl
      - software-properties-common
      - gnupg-agent
      - git
      - htop
      - iftop
      - iotop
      - mosh
      - nfs-common
      - screen
      - sudo
      - unattended-upgrades
      - vim
      - zsh
      - whois
      - python3
      - python3-pip
      - python3-virtualenv
      - python3-setuptools
      - python3-passlib
      - python3-openssl
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: ansible_os_family == "Debian"
  tags:
    - dependencies

- name: Install necessities and nice-to-haves
  pacman:
    name:
      - ca-certificates
      - cifs-utils
      - curl
      - git
      - htop
      - iftop
      - iotop
      - mosh
      - nfs-utils
      - screen
      - sudo
      - vim
      - whois
      - python
      - python-pip
      - python-virtualenv
      - python-setuptools
      - python-passlib
      - python-pyopenssl
      - zsh
    state: present
    update_cache: true
  when: ansible_os_family == "Archlinux"
  tags:
    - dependencies

- name: Install Docker and docker-compose
  apt:
    name:
      - docker-compose
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: ansible_os_family == "Debian"
  tags:
    - dependencies

- name: Install Docker and docker-compose
  pacman:
    name:
      - docker-compose
    state: present
    update_cache: true
  when: ansible_os_family == "Archlinux"
  tags:
    - dependencies

- name: Correct Python version selected
  alternatives:
    name: python
    link: /usr/bin/python
    path: /usr/bin/python3
  when: ansible_os_family == "Debian"


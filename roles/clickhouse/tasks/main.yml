---

- name: Setup {{service_item}}
  include_tasks: includes/setup.yml

- name: Ensure {{service_item}} data directories are writable.
  file:
    path: "{{ volumes_root }}/clickhouse/{{ item }}"
    state: directory
    owner: "101"
    group: "101"
    mode: "0755"
    recurse: "yes"
  loop:
    - data
    - logs

- name: Start {{service_item}}
  include_tasks: includes/start.yml

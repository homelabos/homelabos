---
version: "3"

networks:
  traefik_network:
    external:
      name: homelabos_traefik

services:
  hlos_dash_web:
    build:
      context: ../..
      dockerfile: hlos_dash/deploy/web.Dockerfile
      args:
        HLOS_DASH_API_URL: https://homelabos.averneth.com
    image: prolabos/hlos-dash-web:dev
    restart: unless-stopped
    networks:
      - traefik_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.http.services.hlos_dash_web.loadbalancer.server.scheme=http"
      - "traefik.http.services.hlos_dash_web.loadbalancer.server.port=80"
      - "traefik.enable=true"
      - "traefik.docker.network=homelabos_traefik"
      - "traefik.http.routers.hlos_dash_web-http.service=hlos_dash_web"
      - "traefik.http.routers.hlos_dash_web-http.rule=Host(`homelabos.averneth.com`)"
      - "traefik.http.routers.hlos_dash_web-http.entrypoints=http"
      - "traefik.http.routers.hlos_dash_web-http.middlewares=customFrameHomelab@file"
      - "traefik.http.routers.hlos_dash_web.service=hlos_dash_web"
      - "traefik.http.routers.hlos_dash_web.rule=Host(`homelabos.averneth.com`)"
      - "traefik.http.routers.hlos_dash_web.entrypoints=https"
      - "traefik.http.routers.hlos_dash_web.middlewares=customFrameHomelab@file"
      - "traefik.http.routers.hlos_dash_web.tls=true"
      - "traefik.http.routers.hlos_dash_web.tls.certresolver=http"
      - "traefik.http.routers.hlos_dash_web.priority=10"
      - "traefik.http.routers.hlos_dash_web-http.priority=10"

---

- name: Setup {{service_item}}
  include_tasks: includes/setup.yml

- name: Create necessary folders, with appropriate permissions.
  file:
    path: "{{ volumes_root }}/nextcloud/{{ item }}"
    state: directory
    owner: "{{ uid_output.stdout }}"
    group: "{{ gid_output.stdout }}"
    mode: "0777"
  with_items:
    - "apps"
    - "config"
    - "webroot"
    - "themes"

- name: Create redis-session.ini file
  file:
    path: "{{ volumes_root }}/nextcloud/redis-session.ini"
    state: touch
    owner: "{{ uid_output.stdout }}"
    group: "{{ gid_output.stdout }}"

- name: Start {{service_item}}
  include_tasks: includes/start.yml

- name: Create nextcloud turnserver.conf file
  template:
    src: "{{ playbook_dir }}/roles/nextcloud/templates/turnserver.conf.j2"
    dest: "{{ volumes_root }}/nextcloud/turnserver.conf"
    owner: "{{ uid_output.stdout }}"
    group: "{{ gid_output.stdout }}"
    mode: "0644"
  when: nextcloud.talk_enabled | default(False)

- name: Install Talk (spreed) app
  command: "docker-compose -f \"{{ volumes_root }}/nextcloud/docker-compose.yml\" exec -T nextcloud php occ app:install spreed"
  become: yes
  when: nextcloud.talk_enabled | default(False)
  register: spreed_install
  ignore_errors: yes
  retries: 30
  delay: 2
  until: spreed_install is success

- name: Enable Talk (spreed) app
  command: "docker-compose -f \"{{ volumes_root }}/nextcloud/docker-compose.yml\" exec -T nextcloud php occ app:enable spreed"
  become: yes
  when: nextcloud.talk_enabled | default(False)

- name: Delete existing Talk STUN server (idempotent)
  command: >-
    docker-compose -f "{{ volumes_root }}/nextcloud/docker-compose.yml" exec -T nextcloud
    php occ talk:stun:delete {{ service_domain }}:{{ nextcloud.talk_turn_port }}
  become: yes
  when: nextcloud.talk_enabled | default(False)
  ignore_errors: yes

- name: Add Talk STUN server
  command: >-
    docker-compose -f "{{ volumes_root }}/nextcloud/docker-compose.yml" exec -T nextcloud
    php occ talk:stun:add {{ service_domain }}:{{ nextcloud.talk_turn_port }}
  become: yes
  when: nextcloud.talk_enabled | default(False)

- name: Delete existing Talk TURN server (idempotent)
  command: >-
    docker-compose -f "{{ volumes_root }}/nextcloud/docker-compose.yml" exec -T nextcloud
    php occ talk:turn:delete {{ nextcloud.talk_turn_schemes }} {{ service_domain }}:{{ nextcloud.talk_turn_port }} {{ nextcloud.talk_turn_protocols }}
  become: yes
  when: nextcloud.talk_enabled | default(False)
  ignore_errors: yes

- name: Add Talk TURN server
  command: >-
    docker-compose -f "{{ volumes_root }}/nextcloud/docker-compose.yml" exec -T nextcloud
    php occ talk:turn:add {{ nextcloud.talk_turn_schemes }} {{ service_domain }}:{{ nextcloud.talk_turn_port }} {{ nextcloud.talk_turn_protocols }}
    --secret="{{ lookup('password', './settings/passwords/nextcloud_turn_secret chars=ascii_letters') }}"
  become: yes
  when: nextcloud.talk_enabled | default(False)

- name: Delete existing Talk signaling server (High-performance backend, idempotent)
  command: >-
    docker-compose -f "{{ volumes_root }}/nextcloud/docker-compose.yml" exec -T nextcloud
    php occ talk:signaling:delete https://{{ nextcloud.talk_signaling_subdomain | default('signaling') }}.{{ domain }}
  become: yes
  when: nextcloud.talk_enabled | default(False) and nextcloud.talk_signaling_enabled | default(False)
  ignore_errors: yes

- name: Add Talk signaling server (High-performance backend)
  command: >-
    docker-compose -f "{{ volumes_root }}/nextcloud/docker-compose.yml" exec -T nextcloud
    php occ talk:signaling:add {% if nextcloud.talk_signaling_verify | default(True) %}--verify{% endif %}
    https://{{ nextcloud.talk_signaling_subdomain | default('signaling') }}.{{ domain }}
    "{{ lookup('password', './settings/passwords/nextcloud_signaling_secret chars=ascii_letters') }}"
  become: yes
  when: nextcloud.talk_enabled | default(False) and nextcloud.talk_signaling_enabled | default(False)
  register: signaling_add
  retries: 30
  delay: 2
  until: signaling_add is success

- name: Register Talk recording server (recording_servers)
  command: >-
    docker-compose -f "{{ volumes_root }}/nextcloud/docker-compose.yml" exec -T nextcloud
    php occ config:app:set spreed recording_servers --value='{"servers":[{"server":"https://{{ nextcloud.talk_recording_subdomain | default('recording') }}.{{ domain }}","verify":true}],"secret":"{{ lookup('password', './settings/passwords/nextcloud_recording_secret chars=ascii_letters') }}"}'
  become: yes
  when: nextcloud.talk_enabled | default(False) and nextcloud.talk_recording_enabled | default(False)

- name: Set Talk recording consent requirement
  command: >-
    docker-compose -f "{{ volumes_root }}/nextcloud/docker-compose.yml" exec -T nextcloud
    php occ config:app:set spreed recording_consent --value="{{ '1' if nextcloud.talk_recording_consent | default(False) else '0' }}"
  become: yes
  when: nextcloud.talk_enabled | default(False) and nextcloud.talk_recording_enabled | default(False)

- name: Install user_oidc app (Authentik OIDC)
  command: "docker compose -f \"{{ volumes_root }}/nextcloud/docker-compose.yml\" exec -T nextcloud php occ app:install user_oidc"
  become: yes
  when: nextcloud.oidc_enabled | default(False)
  register: oidc_install
  ignore_errors: yes
  retries: 30
  delay: 2
  until: oidc_install is success

- name: Enable user_oidc app
  command: "docker compose -f \"{{ volumes_root }}/nextcloud/docker-compose.yml\" exec -T nextcloud php occ app:enable user_oidc"
  become: yes
  when: nextcloud.oidc_enabled | default(False)

- name: Register Authentik OIDC provider in user_oidc
  command: >-
    docker compose -f "{{ volumes_root }}/nextcloud/docker-compose.yml" exec -T nextcloud
    php occ user_oidc:provider authentik
    --clientid="{{ nextcloud.oidc_client_id }}"
    --clientsecret="{{ nextcloud.oidc_client_secret }}"
    --discoveryuri="{{ nextcloud.oidc_discovery_uri }}"
    --scope="{{ nextcloud.oidc_scope | default('openid email profile') }}"
    --mapping-uid="{{ nextcloud.oidc_uid_mapping | default('preferred_username') }}"
    --unique-uid=0
  become: yes
  when: nextcloud.oidc_enabled | default(False)

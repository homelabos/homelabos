---
- name: Install ipTables-persistent
  apt:
    name: iptables-persistent
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: ansible_os_family == "Debian"

- name: Install ipTables
  pacman:
    name: iptables
    state: present
    update_cache: true
  when: ansible_os_family == "Archlinux"

- name: Ensure ipTables configuration directory exists
  file:
    path: /etc/iptables
    state: directory
    mode: "0755"

- name: Set basic IPTables Rules
  iptables:
    chain: INPUT
    policy: ACCEPT

- name: Set basic IPTables Rules
  iptables:
    chain: FORWARD
    policy: ACCEPT

- name: Set basic IPTables Rules
  iptables:
    chain: OUTPUT
    policy: ACCEPT

- name: Establish DNAT rules
  iptables:
    table: nat
    chain: PREROUTING
    in_interface: "{{ bastion.interface }}"
    protocol: tcp
    destination_port: "{{ item.key }}"
    to_destination: "{{ bastion.wireguard.homelab_vpn_address }}:{{ item.value }}"
    jump: DNAT
  loop: "{{ bastion.ports_to_forward | dict2items }}"
  become: true

- name: Establish SNAT rules
  iptables:
    table: nat
    chain: POSTROUTING
    out_interface: wg0
    protocol: tcp
    to_source: "{{ bastion.wireguard.bastion_vpn_address }}"
    jump: SNAT
  loop: "{{ bastion.ports_to_forward | dict2items }}"
  become: true

- name: Set ipTables post-routing masquerade
  iptables:
    table: nat
    chain: POSTROUTING
    jump: MASQUERADE
  become: true

- name: Persist iptable routing across reboots
  shell: iptables-save > /etc/iptables/rules.v4
  when: ansible_os_family == "Debian"

- name: Persist iptable routing across reboots
  shell: iptables-save > /etc/iptables/iptables.rules
  when: ansible_os_family == "Archlinux"

- name: Enable ipTables persistence service
  systemd:
    name: iptables
    enabled: "yes"
    state: started
  when: ansible_os_family == "Archlinux"

- name: Enable IP Forwarding
  shell: sysctl net.ipv4.ip_forward=1
